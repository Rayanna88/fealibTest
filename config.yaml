# Example configuration using PyYAML
# This file demonstrates YAML configuration structure
# that can be loaded with: import yaml; config = yaml.safe_load(open("config.yaml"))

project:
  name: "fealib_test"
  version: "1.0.0"

environment:
  python_version: "3.10"
  platform: "linux/x86_64"
  manylinux: "manylinux_2_34"

dependencies:
  pyfealib: "1.0.0"
  pytest: "latest"
  pytest_xdist: "latest"
  pyyaml: "latest"

test:
  parallel: true
  workers: "auto"
  verbose: true