# =============================================================================
# tests/fixtures/ops_builtin.yaml
# 单元测试用的 ops 表达式配置
#
# 每个 feature 定义对应 OP单元测试用例.csv 中的一个测试子用例。
# 通过 pyfealib.Fealib.run(user_feats, {}, []) 执行，不需要加载 collection 数据。
#
# 输出规则：
#   - float 结果 → export.slot 为 dense (slot < 100)
#   - int32/int64 结果（无 hash）→ export.slot 为 dense 整型（slot 200~）
#   - string 结果 → export.slot 为 sparse + hash (slot 300~)
#   - 数组结果 → export.slot 为 sparse (slot 400~)
# =============================================================================

user_features:

  # ============================================================================
  # TC-UNIT-ARITH-001: add / sub / mul / div
  # ============================================================================

  # 001-01: add(3.5f, 2.0f) = 5.5
  - name: arith_001_01
    op: add
    input:
      - !var_float user.a_f32
      - !var_float user.b_f32
    export:
      slot: 0
      len: 1
      padding: 0.0

  # 001-02: add(10, 3) int32 = 13
  - name: arith_001_02
    op: add
    input:
      - !var_int32 user.a_i32
      - !var_int32 user.b_i32
    export:
      slot: 1
      len: 1
      padding: 0.0

  # 001-03: add(1000000000LL, 2000000000LL) = 3000000000
  - name: arith_001_03
    op: add
    input:
      - !var_int64 user.a_i64
      - !var_int64 user.b_i64
    export:
      slot: 2
      len: 1
      padding: 0.0

  # 001-04: sub(10.0f, 3.5f) = 6.5
