[pytest]
# ===================================================================
# pytest configuration for fealib test suite
# ===================================================================

# Test discovery
testpaths = tests

# Markers
markers =
    unit: Unit tests for individual built-in operators
    integration: Integration tests for end-to-end pyfealib pipeline
    slow: Long-running or stress tests

# Verbosity and output
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider

# Parallel execution (requires pytest-xdist)
# Uncomment to enable:
# addopts = -v --tb=short -n auto

# Log level
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Minimum pytest version
minversion = 7.0
